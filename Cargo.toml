[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/neoworks-dev/neoworks-storage-mesh"

[workspace.dependencies]
mesh-client = { path = "crates/mesh-client" }
mesh-coordinator = { path = "crates/mesh-coordinator" }
mesh-core = { path = "crates/mesh-core" }
mesh-node = { path = "crates/mesh-node" }

anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
axum = "0.8"
blake3 = "1"
blind-rsa-signatures = "0.19"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
fastcdc = { version = "5", features = ["tokio"] }
futures = "0.3"
getrandom = "0.4"
hex = { version = "0.4", features = ["serde"] }
reed-solomon-simd = "3"
# Rustls with its default aws-lc-rs provider, so binaries carry no system TLS
# library. The ring provider would build without a C compiler, but needs a
# provider installed by hand before any client is made, or `Client::new`
# panics; every Raspberry Pi image has a C compiler anyway.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Bundled, so nodes build the same everywhere, including on a Raspberry Pi
# without SQLite installed. `fallible_uint` binds u64 lease times directly;
# they fail only beyond i64::MAX, billions of years away.
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
x25519-dalek = "3"

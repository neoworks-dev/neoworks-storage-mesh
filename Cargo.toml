[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/neoworks-dev/neoworks-storage-mesh"

[workspace.dependencies]
mesh-core = { path = "crates/mesh-core" }
mesh-node = { path = "crates/mesh-node" }

anyhow = "1"
axum = "0.8"
blake3 = "1"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
reed-solomon-simd = "3"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
